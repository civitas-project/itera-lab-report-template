[workspace]
members = [
    "crates/lab-report",
]
default-members = ["crates/lab-report"]
resolver = "2"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"
private_intra_doc_links = "deny"
missing_crate_level_docs = "deny"
invalid_codeblock_attributes = "deny"
invalid_html_tags = "deny"
invalid_rust_codeblocks = "deny"
bare_urls = "deny"

[profile.dev]
debug = "line-tables-only"
strip = "none"

[profile.dev.package."*"]
opt-level = 2
debug = false
strip = "debuginfo"

[profile.test]
debug = "line-tables-only"
opt-level = 1
strip = "debuginfo"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
overflow-checks = false
strip = "symbols"

[profile.bench]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "debuginfo"
